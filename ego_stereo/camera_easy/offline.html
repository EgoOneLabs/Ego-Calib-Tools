<style>
#offline_panel{background:#ffffffc9;border:1px solid white;border-radius:22px;padding:18px 22px;margin-bottom:18px}#offline_panel>summary{font-size:19px;font-weight:650;cursor:pointer}#offline_panel .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}#offline_panel .grid>div{min-width:0}#offline_panel p,#off_results p{overflow-wrap:anywhere}#off_files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#offline_panel select{max-width:100%;text-overflow:ellipsis}@media(max-width:700px){#offline_panel .grid{grid-template-columns:1fr}}
</style>
<section id="off_results" hidden>
<h2>处理结果</h2><p id="off_status">等待开始。</p><progress id="off_progress" hidden></progress>
<p id="off_output"></p>
<div class="actions"><button id="off_open" class="secondary" disabled>打开结果文件夹</button><button id="off_stop" class="secondary" disabled hidden>停止本次计算</button></div>
<details><summary>查看报告、误差和运行日志</summary><div id="off_metrics"></div><div id="off_files"></div><pre id="off_logs"></pre></details>
</section>
<details id="offline_panel">
<summary>单独验证已有结果</summary>
<p>已有联合参数时，选择另一段独立录制，导入下面两个文件，点击验证。无需重复 Camera 和静止 IMU 录制。</p>
<label for="off_dataset">选择用于验证的独立录制<select id="off_dataset"><option value="">正在查找本机数据…</option></select></label>
<p id="off_source" class="hint"></p>
<div class="grid">
<div id="off_camera_group" hidden><label>Camera 相机参数</label><select id="off_camera_recent"><option value="">选择本机参数，或拖入文件</option></select><div id="off_camera_drop" class="drop-zone" tabindex="0" role="button"><strong>拖入 Camera YAML，或点击选择</strong></div><input id="off_camera" type="file" accept=".yaml,.yml" hidden><p id="off_camera_name" class="hint">未选择</p></div>
<div id="off_candidate_group"><label>第三步输出的联合外参 YAML</label><select id="off_candidate_recent"><option value="">选择已有联合结果，或拖入文件</option></select><div id="off_candidate_drop" class="drop-zone" tabindex="0" role="button"><strong>拖入联合外参，或点击选择</strong><p class="hint">包含 T_cam_imu 与 timeshift_cam_imu</p></div><input id="off_candidate" type="file" accept=".yaml,.yml" hidden><p id="off_candidate_name" class="hint">未选择</p></div>
<div><label>第二步输出的 IMU 噪声参数 YAML</label><select id="off_imu_recent"><option value="">选择本机参数，或拖入文件</option></select><div id="off_imu_drop" class="drop-zone" tabindex="0" role="button"><strong>拖入 IMU 参数，或点击选择</strong><p class="hint">可使用当前的 imu-experimental.yaml</p></div><input id="off_imu" type="file" accept=".yaml,.yml" hidden><p id="off_imu_name" class="hint">未选择</p></div>
</div>
<p class="hint">文件必须对应同一套头环和固定装配。当前使用实验时间映射与噪声参数，结果需要复核。</p>
<input id="off_ack" type="checkbox" checked hidden>
<div class="actions"><button id="off_start" disabled>开始验证</button><button id="off_refresh" type="button" class="secondary">刷新列表</button></div>
<p id="off_error" class="failed" role="alert"></p>
<details><summary>高级：处理已有录制</summary><label for="off_action">操作<select id="off_action"><option value="validate" selected>验证已有联合参数</option><option value="calibrate">重新计算联合参数</option></select></label><p id="off_explanation" class="hint"></p></details>
</details>
